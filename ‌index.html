<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Consumos - Residentes</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-color: #f4f6f9; 
            text-align: center; 
            padding-top: 80px; 
            margin: 0;
        }
        .card {
            background: white;
            max-width: 500px;
            margin: 0 auto;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 { color: #333; font-size: 24px; margin-bottom: 10px; }
        p { color: #666; margin-bottom: 30px; font-size: 15px; }
        .btn {
            background-color: #0066cc;
            color: white;
            padding: 14px 28px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            display: inline-block;
            transition: background 0.3s;
        }
        .btn:hover { background-color: #004c99; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Portal de Consumos - Residentes</h1>
        <p>Haz clic en el siguiente botón para acceder de forma segura al sistema de consulta de agua:</p>
        <a class="btn" href="https://script.google.com/macros/s/AKfycbyRB2u1TDQhYncvkH3PrXRsSlzkvBGdDvLj36di24JdtUf9k39GAzBWtvdQj9LlWvpfyQ/exec" target="_blank">Abrir Portal de Residentes</a>
    </div>
</body>
</html>
