<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta de Consumo - Residentes</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f1f5f9;
      margin: 0;
      padding: 20px;
      color: #1e293b;
    }
    .card {
      max-width: 900px;
      margin: 0 auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }
    h1, h2, h3 {
      text-align: center;
      color: #0f172a;
      margin-top: 0;
    }
    .status-box {
      background-color: #f0f9ff;
      border: 2px dashed #0284c7;
      padding: 12px;
      text-align: center;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
    }
    .status-badge { font-weight: 600; color: #0284c7; }

    .form-group { margin-bottom: 20px; }
    label { font-weight: 600; display: block; margin-bottom: 8px; color: #334155; }
    select, input[type="email"] {
      width: 100%;
      padding: 12px;
      border: 2px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
      background-color: #fff;
    }
    .btn-consultar {
      background-color: #0f766e;
      color: white;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn-consultar:hover { background-color: #115e59; }
    .btn-consultar:disabled { background-color: #94a3b8; cursor: not-allowed; }

    .btn-cambiar {
      background-color: #475569;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      margin-bottom: 20px;
    }
    .btn-cambiar:hover { background-color: #334155; }

    .content-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 25px;
      margin-top: 20px;
    }
    .chart-box {
      background-color: #fafafa;
      border: 1px dashed #cbd5e1;
      border-radius: 8px;
      padding: 15px;
      min-height: 350px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .data-table-container { overflow-x: auto; margin-top: 15px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { border: 1px solid #cbd5e1; padding: 10px; text-align: center; }
    th { background-color: #f1f5f9; color: #0f172a; }
  </style>
</head>
<body onload="cargarDatosSistema()">

<div class="card">

  <!-- PANTALLA DE SELECCIÓN E INGRESO DE CORREO -->
  <div id="pantallaLogin">
    <h1>Portal de Consumos - Residentes</h1>
    <p style="text-align: center; color: #475569;">Selecciona tu villa, tu domicilio y escribe tu correo registrado.</p>

    <div class="status-box">
      <span id="status" class="status-badge">Conectando con el sistema...</span>
    </div>

    <div class="form-group">
      <label for="selectVilla">1. Selecciona tu Villa / Privada:</label>
      <select id="selectVilla" onchange="actualizarDomicilios()" disabled>
        <option value="">-- Esperando conexión --</option>
      </select>
    </div>

    <div class="form-group">
      <label for="selectDomicilio">2. Selecciona tu Domicilio / Número Oficial:</label>
      <select id="selectDomicilio" disabled>
        <option value="">-- Primero selecciona una villa --</option>
      </select>
    </div>

    <div class="form-group">
      <label for="inputCorreo">3. Ingresa tu Correo Electrónico Registrado:</label>
      <input type="email" id="inputCorreo" placeholder="tu-correo@ejemplo.com" disabled>
    </div>

    <button id="btnIngresar" class="btn-consultar" onclick="verificarAccesoResidente()" disabled>Consultar mi consumo</button>
  </div>

  <!-- PANTALLA EXCLUSIVA DEL RESIDENTE -->
  <div id="pantallaResultado" style="display: none;">
    <button class="btn-cambiar" onclick="cerrarSesion()">← Cambiar de cuenta / Salir</button>
    <h2 id="tituloResidente" style="color: #0f766e; margin-bottom: 5px;">Mi Historial de Consumo</h2>
    <p id="subtituloResidente" style="text-align: center; color: #64748b; margin-top: 0;"></p>

    <div class="content-layout">
      <div class="chart-box">
        <canvas id="graficaCanvas" style="max-height: 380px;"></canvas>
      </div>

      <div class="data-table-container">
        <h3>Detalle de Registros (m³)</h3>
        <table id="tablaDatos">
          <thead>
            <tr id="tablaEncabezados"></tr>
          </thead>
          <tbody>
            <tr id="tablaValores"></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

</div>

<script>
  // Enlace oficial configurado con tu Apps Script
  const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwUfYWR2-umXRR6refbrGnF9Jm5Qu5CpuXFu6oQh4NDucQYeA6L5uL9GixMSeD0OELPQA/exec';
  
  let directoriosGlobal = {};
  let consumosGlobal = {};
  let miGrafico = null;

  async function cargarDatosSistema() {
    const statusEl = document.getElementById("status");
    const selectVilla = document.getElementById("selectVilla");

    statusEl.textContent = "Cargando villas y consumos...";

    try {
      const response = await fetch(WEB_APP_URL);
      if (!response.ok) throw new Error("Error al conectar con la base de datos.");

      const datosNube = await response.json();
      directoriosGlobal = datosNube.directorios || {};
      consumosGlobal = datosNube.consumos || {};

      selectVilla.innerHTML = '<option value="">-- Selecciona tu villa --</option>';
      let totalVillas = 0;

      Object.keys(consumosGlobal).forEach(villa => {
        if (consumosGlobal[villa] && consumosGlobal[villa].length > 0) {
          const opt = document.createElement("option");
          opt.value = villa;
          opt.textContent = villa;
          selectVilla.appendChild(opt);
          totalVillas++;
        }
      });

      if (totalVillas > 0) {
        statusEl.textContent = "¡Sistema listo! Selecciona tu villa para continuar.";
        statusEl.style.color = "#16a34a";
        selectVilla.disabled = false;
      } else {
        statusEl.textContent = "No se encontraron registros de consumos en las hojas.";
        statusEl.style.color = "#dc2626";
      }

    } catch (error) {
      console.error(error);
      statusEl.textContent = "Error de conexión con la nube.";
      statusEl.style.color = "#dc2626";
    }
  }

  function actualizarDomicilios() {
    const villa = document.getElementById("selectVilla").value;
    const selectDom = document.getElementById("selectDomicilio");
    const inputCorreo = document.getElementById("inputCorreo");
    const btnIngresar = document.getElementById("btnIngresar");

    selectDom.innerHTML = '<option value="">-- Selecciona tu domicilio --</option>';
    selectDom.disabled = true;
    inputCorreo.disabled = true;
    inputCorreo.value = "";
    btnIngresar.disabled = true;

    if (!villa || !consumosGlobal[villa]) return;

    consumosGlobal[villa].forEach((item, idx) => {
      const opt = document.createElement("option");
      opt.value = idx;
      opt.textContent = item.domicilio;
      selectDom.appendChild(opt);
    });

    selectDom.disabled = false;
    selectDom.onchange = function() {
      const activo = (selectDom.value !== "");
      inputCorreo.disabled = !activo;
      btnIngresar.disabled = !activo;
    };
  }

  function verificarAccesoResidente() {
    const villa = document.getElementById("selectVilla").value;
    const idxDomicilio = document.getElementById("selectDomicilio").value;
    const correoIngresado = document.getElementById("inputCorreo").value.trim().toLowerCase();

    if (!villa || idxDomicilio === "" || !correoIngresado) {
      alert("Por favor, completa todos los campos (Villa, Domicilio y Correo).");
      return;
    }

    const casaSeleccionada = consumosGlobal[villa][idxDomicilio];
    const directorioVilla = directoriosGlobal[villa] || [];

    // Buscar si el correo ingresado está autorizado para este domicilio en el directorio de esa villa
    const autorizacion = directorioVilla.find(d => 
      d.correoRegistrado === correoIngresado && 
      (casaSeleccionada.domicilio.toLowerCase().includes(d.domicilioBusqueda.toLowerCase()) || 
       casaSeleccionada.numeroLimpio === d.domicilioBusqueda)
    );

    if (!autorizacion) {
      alert("El correo ingresado no coincide con el registrado para este domicilio en el directorio de " + villa + ".");
      return;
    }

    // Mostrar pantalla de resultados con éxito
    document.getElementById("pantallaLogin").style.display = "none";
    document.getElementById("pantallaResultado").style.display = "block";

    document.getElementById("tituloResidente").textContent = casaSeleccionada.domicilio;
    document.getElementById("subtituloResidente").textContent = `Villa: ${villa} | Cuenta verificada`;

    renderizarGraficaYTabla(casaSeleccionada);
  }

  function renderizarGraficaYTabla(item) {
    const canvas = document.getElementById("graficaCanvas");
    if (miGrafico) miGrafico.destroy();

    const ctx = canvas.getContext("2d");
    miGrafico = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: item.periodos,
        datasets: [{
          label: `Consumo Personal (m³)`,
          data: item.valores,
          backgroundColor: 'rgba(15, 118, 110, 0.75)',
          borderColor: '#0f766e',
          borderWidth: 1.5,
          borderRadius: 6
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: { display: false },
          title: {
            display: true,
            text: `Histórico de Consumos - ${item.domicilio}`,
            font: { size: 15, weight: 'bold' }
          },
          tooltip: {
            callbacks: {
              label: function(context) {
                return ` Consumo: ${context.raw} m³`;
              }
            }
          }
        },
        scales: {
          y: { 
            beginAtZero: true,
            title: { display: true, text: 'Volumen (m³)', font: { weight: 'bold' } }
          },
          x: {
            title: { display: true, text: 'Periodos / Meses', font: { weight: 'bold' } }
          }
        }
      }
    });

    const trEnc = document.getElementById("tablaEncabezados");
    const trVal = document.getElementById("tablaValores");

    trEnc.innerHTML = '<th>Periodo / Mes</th>';
    trVal.innerHTML = '<th>Consumo registrado</th>';

    item.periodos.forEach((p, i) => {
      trEnc.innerHTML += `<th>${p}</th>`;
      trVal.innerHTML += `<td>${item.valores[i]} m³</td>`;
    });
  }

  function cerrarSesion() {
    document.getElementById("pantallaResultado").style.display = "none";
    document.getElementById("pantallaLogin").style.display = "block";
    document.getElementById("selectVilla").value = "";
    document.getElementById("selectDomicilio").innerHTML = '<option value="">-- Primero selecciona una villa --</option>';
    document.getElementById("selectDomicilio").disabled = true;
    document.getElementById("inputCorreo").value = "";
    document.getElementById("inputCorreo").disabled = true;
    document.getElementById("btnIngresar").disabled = true;
    if (miGrafico) miGrafico.destroy();
  }
</script>

</body>
</html>
